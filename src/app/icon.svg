<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Rounded squircle background with gradient -->
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="32" height="32" rx="8" fill="url(#brandGrad)" />

  <!-- Briefcase icon in crisp white -->
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path
      d="M12 9.5V8C12 6.89543 12.8954 6 14 6H18C19.1046 6 20 6.89543 20 8V9.5"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Body -->
    <rect
      x="5.5"
      y="9.5"
      width="21"
      height="14.5"
      rx="3"
      fill="#2563EB"
      stroke="#FFFFFF"
      stroke-width="2"
      stroke-linejoin="round"
    />
    <!-- Center clasp / accent -->
    <path
      d="M5.5 15.5H26.5"
      stroke="#FFFFFF"
      stroke-width="1.75"
      stroke-linecap="round"
      stroke-opacity="0.85"
    />
    <rect
      x="13.5"
      y="14"
      width="5"
      height="3.5"
      rx="1"
      fill="#60A5FA"
      stroke="#FFFFFF"
      stroke-width="1.5"
    />
  </g>
</svg>